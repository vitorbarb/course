    <script>
        output = []
        var n = 1;

            if(n % 3 === 0 && n % 5 === 0){

            else if (n % 5 === 0){
                output.push("buzz")
            }
            else if (n % 3 == 0 ){
                output.push("fizz")
            }
            else{
            
            
            output.push(n)
        }
    n += 1
    }
        
    document.querySelector("#fizzbuzz").innerHTML = output

    </script>
